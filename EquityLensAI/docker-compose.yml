version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: equitylensai-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGIN=http://localhost:3000,http://127.0.0.1:3000
      - LOG_LEVEL=info
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-production-fallback-secret-minimum-32-chars-long}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_RESEARCH_ENABLED=${AI_RESEARCH_ENABLED:-false}
      - ANGEL_API_KEY=${ANGEL_API_KEY:-}
      - ANGEL_CLIENT_ID=${ANGEL_CLIENT_ID:-}
      - ANGEL_PASSWORD=${ANGEL_PASSWORD:-}
      - ANGEL_TOTP_SECRET=${ANGEL_TOTP_SECRET:-}
      - ALERT_SCHEDULER_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
        - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL:-}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
    container_name: equitylensai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
